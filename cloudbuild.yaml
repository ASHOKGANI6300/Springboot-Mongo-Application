steps:
  - name: 'gcr.io/cloud-builders/mvn'
    entrypoint: 'mvn'
    args: ['package', '-Dmaven.test.skip=true']
    
  - name: "gcr.io/cloud-builders/docker"
    args: [
      "build",
      "-t",
      "us-central1-docker.pkg.dev/fresh-yen-467406-t1/myappregistry/springbootapp:$SHORT_SHA",
      "."
    ]
    timeout: 600s
    id: 'Deploy to Build an Image From Dockerfile'
  - name: "gcr.io/cloud-builders/docker"
    args: [
      "push",
      "us-central1-docker.pkg.dev/fresh-yen-467406-t1/myappregistry/springbootapp:$SHORT_SHA"
    ]
    timeout: 600s
    id: 'Deploy to Image Push to Artifact Repo'
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args: [
      "run",
      "deploy",
      "my-cloud-run-service",
      "--image",
      "us-central1-docker.pkg.dev/fresh-yen-467406-t1/myappregistry/springbootapp:$SHORT_SHA",
      "--region",
      "us-central1",
      "--platform",
      "managed",
      "--allow-unauthenticated" ,
      "--memory",
      "1Gi",
      "--cpu",
      "1",
      "--min-instances",
      "1",
      "--max-instances",
      "2",
      "--port",
      "8080"
    ]
    env:
    - 'CLOUDSDK_COMPUTE_REGION=us-central1'
    - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
    
artifacts:
  objects:
    location: 'gs://cloudlbstoreweb/mountfolder/'
    paths:
      - 'target/spring-boot-mongo-1.0.jar'

images:
  - "us-central1-docker.pkg.dev/fresh-yen-467406-t1/myappregistry/springbootapp:$SHORT_SHA"
options:
   machineType: 'E2_HIGHCPU_8'
   diskSizeGb: '2'
   logging: CLOUD_LOGGING_ONLY
   #logsBucket: 'gs://cloudlbstoreweb'
